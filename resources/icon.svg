<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- VstPlayer icon (large: 48 px and up). A carillon bell with a waveform cut through it, on the
       dark tile of the app theme (src/ui/Theme.h: background, bar, outline, accent, text).
       resources/icon-small.svg is the simplified drawing for 16 and 32 px.
       PNGs: node tools/render-icon.mjs -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e35"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f86e6"/>
      <stop offset="0.45" stop-color="#6db8ff"/>
      <stop offset="1" stop-color="#2a74c9"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)" stroke="#3a3f48" stroke-width="4"/>
  <!-- sound arcs -->
  <g fill="none" stroke="#4aa3ff" stroke-linecap="round" opacity="0.6" stroke-width="12">
    <path d="M48 88 A72 72 0 0 0 48 164"/>
    <path d="M208 88 A72 72 0 0 1 208 164"/>
  </g>
  <!-- hanger -->
  <rect x="116" y="30" width="24" height="22" rx="8" fill="#9aa1ab"/>
  <!-- bell body -->
  <path d="M128 44
           C 100 44 86 64 84 96
           C 82 128 80 150 62 168
           Q 56 176 64 180
           L 192 180
           Q 200 176 194 168
           C 176 150 174 128 172 96
           C 170 64 156 44 128 44 Z" fill="url(#bell)"/>
  <!-- lip -->
  <rect x="52" y="174" width="152" height="18" rx="9" fill="#e8e9eb"/>
  <!-- waveform cut through the bell -->
  <path d="M86 122 L100 122 L108 100 L118 146 L128 92 L138 152 L148 104 L156 132 L162 122 L170 122"
        fill="none" stroke="#1a1c20" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- clapper -->
  <circle cx="128" cy="210" r="16" fill="#e8e9eb"/>
</svg>
